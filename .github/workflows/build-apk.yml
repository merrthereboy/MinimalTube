name: Build MinimalTube APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace

    - name: Prepare APK Release Artifact
      run: |
        cp app/build/outputs/apk/release/app-release.apk MinimalTube-v1.2.0.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MinimalTube-v1.2.0-APK
        path: MinimalTube-v1.2.0.apk

    - name: Publish GitHub Release v1.2.0
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.0
        name: MinimalTube v1.2.0 Pro (Gestures, Livestream, Comments & Deep Sync)
        body_path: RELEASE_NOTES.md
        files: MinimalTube-v1.2.0.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
